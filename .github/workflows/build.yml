name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p mailnode --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/mailnode out/
          cd out && shasum -a 256 mailnode > mailnode.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mailnode-${{ matrix.target }}
          path: out/
          if-no-files-found: error
