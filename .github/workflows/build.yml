name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
      # The test harnesses read the client's UTF-8 output and print it; Windows defaults to cp1252.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p islandmail-node --target ${{ matrix.target }}
      - name: Exercise direct-peer mail and agent clients
        run: |
          host_python=$(command -v python3 || command -v python)
          "$host_python" -m venv "$RUNNER_TEMP/mail-test"
          if [ -d "$RUNNER_TEMP/mail-test/Scripts" ]; then py="$RUNNER_TEMP/mail-test/Scripts/python"; else py="$RUNNER_TEMP/mail-test/bin/python"; fi
          "$py" -m pip install -r clients/requirements.txt 'websockets>=12,<17'
          "$py" tests/client_paseto.py
          "$py" tests/client_show.py
          "$py" tests/client_local.py
          node_bin="target/${{ matrix.target }}/release/islandmail-node$EXE"
          "$py" tests/two_nodes.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/two-peers"
          "$py" tests/phase2.py --bin "$node_bin" --repo . --workdir "$RUNNER_TEMP/three-peers"
          "$py" tests/network.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/certified"
          "$py" tests/homes.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/homes"
          "$py" tests/client_wake.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/wake"
          "$py" tests/big_files.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/big-files"
          "$py" tests/certify_held.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/certify-held"
          "$py" tests/rooms.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/rooms"
          "$py" tests/invite.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/invite"
      - name: Package
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/islandmail-node$EXE" out/
          cd out
          host_python=$(command -v python3 || command -v python)
          "$host_python" -c 'import hashlib, sys; n = sys.argv[1]; print(hashlib.sha256(open(n, "rb").read()).hexdigest() + "  " + n)' "islandmail-node$EXE" > "islandmail-node$EXE.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: islandmail-node-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  # A pushed tag v* publishes a release from the binaries built and tested above at that exact commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp artifacts/islandmail-node-x86_64-unknown-linux-gnu/islandmail-node dist/islandmail-node-x86_64-linux
          cp artifacts/islandmail-node-aarch64-unknown-linux-gnu/islandmail-node dist/islandmail-node-aarch64-linux
          cp artifacts/islandmail-node-aarch64-apple-darwin/islandmail-node dist/islandmail-node-aarch64-macos
          cp artifacts/islandmail-node-x86_64-pc-windows-msvc/islandmail-node.exe dist/islandmail-node-x86_64-windows.exe
          cp clients/islandmail.py clients/requirements.txt dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Islandmail $TAG" \
            --notes-file ".github/release-notes/$TAG.md" dist/*
