name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes the run before it; tag (release) and pull request runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: aarch64-macos
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: x86_64-macos
          # Linux binaries link the runner's glibc: build on 22.04 so they run on 22.04 and newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: x86_64-linux
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: aarch64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            asset: x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
      # The test harnesses read the client's UTF-8 output and print it; Windows defaults to cp1252.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p islandmail-node --target ${{ matrix.target }}
      - name: Exercise direct-peer mail and agent clients
        run: |
          host_python=$(command -v python3 || command -v python)
          "$host_python" -m venv "$RUNNER_TEMP/mail-test"
          if [ -d "$RUNNER_TEMP/mail-test/Scripts" ]; then py="$RUNNER_TEMP/mail-test/Scripts/python"; else py="$RUNNER_TEMP/mail-test/bin/python"; fi
          "$py" -m pip install -r clients/requirements.txt 'websockets>=12,<17'
          "$py" tests/client_paseto.py
          "$py" tests/client_show.py
          "$py" tests/client_local.py
          "$py" tests/client_reprove.py
          node_bin="target/${{ matrix.target }}/release/islandmail-node$EXE"
          "$py" tests/two_nodes.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/two-peers"
          "$py" tests/phase2.py --bin "$node_bin" --repo . --workdir "$RUNNER_TEMP/three-peers"
          "$py" tests/network.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/certified"
          "$py" tests/homes.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/homes"
          "$py" tests/client_wake.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/wake"
          "$py" tests/big_files.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/big-files"
          "$py" tests/sync_peers.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/sync-peers"
          "$py" tests/certify_held.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/certify-held"
          "$py" tests/rooms.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/rooms"
          "$py" tests/invite.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/invite"
          "$py" tests/hub_rooms.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/hub-rooms"
          "$py" tests/late_rooms.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/late-rooms"
          "$py" tests/privacy.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/privacy"
          "$py" tests/api_guard.py --bin "$node_bin" --workdir "$RUNNER_TEMP/api-guard"
      - name: Package
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/islandmail-node$EXE" out/
          cd out
          host_python=$(command -v python3 || command -v python)
          "$host_python" -c 'import hashlib, sys; n = sys.argv[1]; print(hashlib.sha256(open(n, "rb").read()).hexdigest() + "  " + n)' "islandmail-node$EXE" > "islandmail-node$EXE.sha256"
      # The installers against this build's own files laid out as a release, twice (the second run is an upgrade).
      - name: Install from this build (install.sh)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/islandmail-node" "dist/islandmail-node-${{ matrix.asset }}"
          cp clients/islandmail.py clients/requirements.txt dist/
          (cd dist && shasum -a 256 -- * > SHA256SUMS)
          bash install.sh --from dist
          bash install.sh --from dist
          ~/.local/bin/islandmail-node --version
          ~/.local/bin/islandmail --help > /dev/null
      - name: Install from this build (install.ps1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\islandmail-node.exe" "dist\islandmail-node-${{ matrix.asset }}"
          Copy-Item clients\islandmail.py, clients\requirements.txt dist\
          $sums = foreach ($f in Get-ChildItem dist -File) { (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower() + "  " + $f.Name }
          Set-Content -Path dist\SHA256SUMS -Value $sums
          .\install.ps1 -From dist
          .\install.ps1 -From dist
          & "$HOME\.local\bin\islandmail-node.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$HOME\.local\bin\islandmail.cmd" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: islandmail-node-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  # Upgrade without rejoin: nodes on the previous release (the newest earlier v* tag after tests/upgrade-baseline, else that
  # baseline)
  # with mail, a room, a joined outsider and a pending invite, swapped one by one to this build.
  upgrade:
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: upgrade-ubuntu-22.04
          workspaces: |
            . -> target
            ../previous -> target
      - name: Build the previous release and this one
        run: |
          # Release tags after the pinned baseline (older tags are the pre-Islandmail line), else the baseline.
          pinned=$(grep -v '^#' tests/upgrade-baseline | head -n 1)
          base=$(git tag -l 'v*' --sort=-v:refname --contains "$pinned" --no-contains HEAD | head -n 1)
          [ -n "$base" ] || base=$pinned
          echo "upgrading from $base"
          # The cache restores ../previous/target, so the folder may exist: unpack the sources into it (no worktree).
          mkdir -p ../previous
          git archive "$base" | tar -x -C ../previous
          (cd ../previous && cargo build --locked --release -p islandmail-node)
          cargo build --locked --release -p islandmail-node
      - name: Upgrade without rejoin
        run: |
          python3 -m venv "$RUNNER_TEMP/up"
          "$RUNNER_TEMP/up/bin/python" -m pip install -r clients/requirements.txt
          "$RUNNER_TEMP/up/bin/python" tests/upgrade.py --old-bin ../previous/target/release/islandmail-node \
            --old-islandmail ../previous/clients/islandmail.py --bin target/release/islandmail-node \
            --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/upgrade"

  # A pushed tag v* publishes a release from the binaries built and tested above at that exact commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Assemble
        run: |
          mkdir dist
          cp artifacts/islandmail-node-x86_64-unknown-linux-gnu/islandmail-node dist/islandmail-node-x86_64-linux
          cp artifacts/islandmail-node-aarch64-unknown-linux-gnu/islandmail-node dist/islandmail-node-aarch64-linux
          cp artifacts/islandmail-node-aarch64-apple-darwin/islandmail-node dist/islandmail-node-aarch64-macos
          cp artifacts/islandmail-node-x86_64-apple-darwin/islandmail-node dist/islandmail-node-x86_64-macos
          cp artifacts/islandmail-node-x86_64-pc-windows-msvc/islandmail-node.exe dist/islandmail-node-x86_64-windows.exe
          cp clients/islandmail.py clients/requirements.txt dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      # A signed build-provenance attestation per file (Sigstore, no key to manage); install.sh and install.ps1
      # check SHA256SUMS against it with gh attestation verify when gh is logged in.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a hyphen (v0.2.0-rc1) is a prerelease.
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Islandmail $TAG" "${pre[@]}" \
            --notes-file ".github/release-notes/$TAG.md" dist/*

  # The published release through the installers as a user runs them (main's installer body, attestation check).
  install-release:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          bash install.sh --tag "$TAG" | tee install.log
          grep -q "attested by" install.log
          ~/.local/bin/islandmail-node --version
          ~/.local/bin/islandmail --help > /dev/null
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -Tag $env:TAG 6>&1 | Tee-Object -FilePath install.log
          if (-not (Select-String -Quiet "attested by" install.log)) { exit 1 }
          & "$HOME\.local\bin\islandmail-node.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$HOME\.local\bin\islandmail.cmd" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
