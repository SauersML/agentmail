name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p mailnode --target ${{ matrix.target }}
      - name: Exercise direct-peer mail and agent clients
        run: |
          python3 -m venv "$RUNNER_TEMP/mail-test"
          . "$RUNNER_TEMP/mail-test/bin/activate"
          python -m pip install -r clients/requirements.txt 'websockets>=12,<17'
          python tests/client_paseto.py
          python tests/client_show.py
          python tests/client_local.py
          node_bin="target/${{ matrix.target }}/release/mailnode"
          python tests/two_nodes.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/two-peers"
          python tests/phase2.py --bin "$node_bin" --repo . --workdir "$RUNNER_TEMP/three-peers"
          python tests/network.py --bin "$node_bin" --islandmail clients/islandmail.py --workdir "$RUNNER_TEMP/certified"
      - name: Package
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/mailnode out/
          cd out && shasum -a 256 mailnode > mailnode.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailnode-${{ matrix.target }}
          path: out/
          if-no-files-found: error
