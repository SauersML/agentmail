name: audit

# Supply chain: RustSec advisories (cargo audit) and licenses, bans, advisories and sources (cargo deny, deny.toml),
# for the node's lock file and the fuzz crates' lock file. Daily too, since advisories appear without a push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: audit
      - run: cargo install cargo-audit --locked --version 0.23.0 && cargo install cargo-deny --locked --version 0.22.1
      - name: cargo audit
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: cargo deny
        run: |
          cargo deny --locked check advisories bans licenses sources
          cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories bans licenses sources
