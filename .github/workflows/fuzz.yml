name: fuzz

# The fuzz targets in fuzz/ (the parsers of untrusted bytes), nightly and on demand. A crash fails the run and is
# uploaded. Reproduce locally with `cargo fuzz run TARGET crash-file` (from fuzz/, nightly or RUSTC_BOOTSTRAP=1).

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz each target for 5 minutes
        working-directory: fuzz
        env:
          TMPDIR: /dev/shm
        run: |
          mkdir -p artifacts
          for t in $(cargo fuzz list); do
            seeds=()
            if [ -d "seeds/$t" ]; then seeds=("seeds/$t"); fi
            mkdir -p "corpus/$t"
            cargo fuzz run -O --debug-assertions "$t" "corpus/$t" "${seeds[@]}" -- -max_total_time=300 -timeout=30 \
              -rss_limit_mb=4096 -max_len=65536 -artifact_prefix=artifacts/
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
