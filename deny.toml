# cargo deny: advisories, licenses, bans and sources for the node and the fuzz crates (CI: .github/workflows/audit.yml).

[graph]
# The platforms the node is built for (build.yml); wasm-only dependencies of iroh are out of scope.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained transitive crates are reported by cargo audit (.cargo/audit.toml lists the reviewed ones).
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    # libFuzzer (fuzz/ only)
    "NCSA",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
