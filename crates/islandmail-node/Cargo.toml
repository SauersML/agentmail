[package]
name = "islandmail-node"
description = "Islandmail node: iroh transport, gossip + anti-entropy replication, loopback HTTP/MCPL API"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
islandmail-core = { path = "../islandmail-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures = "0.3"
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.102.0", default-features = false, features = ["net"] }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
iroh-relay = { version = "1", default-features = false, features = ["server"] }

[lints.rust]
# Set by cargo fuzz for the fuzz/ targets.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
