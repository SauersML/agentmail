<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Islandmail</title>
<style>
:root {
  --bg: #ffffff; --side: #f6f6f7; --text: #1d1f23; --muted: #6a6e78; --line: #e6e6ea; --sel: #e8e9ee;
  --accent: #3f5bd8; --on-accent: #ffffff; --mark: #fff3c4; --input: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --side: #1d1e22; --text: #e4e5e9; --muted: #9a9da6; --line: #2c2e33; --sel: #2b2d33;
    --accent: #8ea0ff; --on-accent: #111318; --mark: #4a4020; --input: #121316;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--text); background: var(--input); }
[hidden] { display: none !important; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; height: 100dvh; }

.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.side-top { display: flex; gap: 8px; padding: 12px; }
.find { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 14px; outline: none; }
.find:focus, .to:focus, .rname:focus { border-color: var(--accent); }
.btn { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
.conv { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; }
.conv:hover { background: var(--sel); }
.conv.sel { background: var(--sel); }
.conv .c { flex: 1; min-width: 0; }
.conv .n, .conv .s { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .n { font-weight: 500; }
.conv .s { color: var(--muted); font-size: 13px; }
.conv.unread .n { font-weight: 700; }
.conv .w { color: var(--muted); font-size: 12px; align-self: flex-start; margin-top: 2px; }
.count { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
  font-size: 12px; font-weight: 700; text-align: center; line-height: 20px; }
.me { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 24px 16px; text-align: center; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); min-height: 52px; }
.back { display: none; font-size: 20px; color: var(--muted); padding: 0 6px; }
.title { flex: 1; min-width: 0; }
.title b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; padding: 8px 0 16px; }
.earlier { display: block; margin: 8px auto; color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; }

.msg { padding: 1px 20px; }
.msg.first { margin-top: 10px; }
.day { text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; margin: 18px 0 6px; }
.who { font-weight: 650; margin-right: 8px; }
.at { color: var(--muted); font-size: 12px; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.text a { color: var(--accent); }
.text .mine { background: var(--mark); border-radius: 3px; }
.msg.event { color: var(--muted); font-size: 11.5px; text-align: center; opacity: .75; padding-top: 0; padding-bottom: 0; }
.msg.reply { padding-left: 34px; }
.quote { border-left: 2px solid var(--line); padding-left: 8px; margin: 2px 0; color: var(--muted); font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.rep { visibility: hidden; color: var(--muted); font-size: 12px; margin-left: 8px; }
.msg > .rep { float: right; }
.msg:hover .rep, .msg.tap .rep { visibility: visible; }
@media (hover: none) { .rep { font-size: 13px; padding: 2px 6px; } }
.file { display: inline-block; margin: 4px 8px 0 0; color: var(--accent); font-size: 13px; }

.compose { padding: 8px 20px 14px; border-top: 1px solid var(--line); }
.compose .row { display: flex; gap: 8px; align-items: flex-end; }
.compose textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  line-height: 1.4; max-height: 40vh; outline: none; }
.compose textarea:focus { border-color: var(--accent); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 4px; min-height: 1em; }
.note .err { color: #c2413a; }
.replying { color: var(--muted); font-size: 13px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.newform { padding: 16px 20px; display: grid; gap: 8px; }
.to, .rname { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; }
.blank { flex: 1; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
.gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 16px; }
.gate p { color: var(--muted); max-width: 420px; }
.gate code { display: block; margin-top: 8px; color: var(--text); overflow-wrap: anywhere; }

@media (max-width: 700px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .main { display: none; }
  .app.open .side { display: none; }
  .app.open .main { display: flex; }
  .back { display: block; }
  .head, .msg, .compose, .newform { padding-left: 12px; padding-right: 12px; }
  .msg.reply { padding-left: 26px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-top">
      <input class="find" id="find" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search conversations">
      <button class="btn" id="new" type="button" hidden>New</button>
    </div>
    <nav class="list" id="list"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<datalist id="people"></datalist>
<script>
'use strict';
// Everything from the network (message text, names, file names, topics) goes into the page as text nodes only.
const PAGE = 60;
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const appEl = $('app'), listEl = $('list'), mainEl = $('main'), findEl = $('find');
const S = { me: null, rooms: [], roomsRaw: '', rows: new Map(), cur: null, info: null, infoRaw: '', msgs: [], byEnv: new Map(),
  nodes: new Map(), maxSeq: 0, more: false, loaded: false, token: 0, replyTo: null, readAt: '' };
let V = null; // the open conversation's elements

/* ---------- key and requests ---------- */
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
const hashParams = () => new URLSearchParams(location.hash.replace(/^#/, ''));
let KEY = null;
(function () {
  const p = hashParams(), k = p.get('k');
  if (k) {
    KEY = k; ssSet('amui.k', k);
    const room = p.get('room');
    history.replaceState(null, '', location.pathname + location.search + (room ? '#room=' + encodeURIComponent(room) : ''));
  } else KEY = ssGet('amui.k');
})();
function gate(title, intro) {
  if (document.querySelector('.gate')) return;
  const g = el('div', 'gate'), c = el('div');
  c.append(el('h2', null, title), el('p', null, intro), el('code', null, 'python3 clients/islandmail.py ui --post'));
  g.append(c); document.body.append(g);
}
const expired = () => { ssSet('amui.k', null); gate('Link expired', 'This link expired. Get a new one with:'); };
async function call(path, body) {
  const opt = { headers: { Authorization: 'Bearer ui.' + KEY }, cache: 'no-store' };
  if (body !== undefined) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { expired(); throw new Error('link expired'); }
  const raw = await r.text();
  let j = {}; try { j = JSON.parse(raw); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return { j, raw };
}
const qs = o => Object.entries(o).filter(([, v]) => v != null).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
function fileUrl(id) {
  if (!/^[0-9a-f]{64}$/i.test(id)) return Promise.reject(new Error('bad id'));
  return fetch('/ui/api/files/' + id, { headers: { Authorization: 'Bearer ui.' + KEY }, cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); }).then(b => URL.createObjectURL(b));
}

/* ---------- formatting ---------- */
const fTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const fDate = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
const fWeek = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
const fDay = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const fFull = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const when = ts => { const t = Date.parse(ts); return isNaN(t) ? null : new Date(t); };
const dayKey = d => d ? d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() : '';
function shortWhen(ts) {
  const d = when(ts); if (!d) return '';
  const now = new Date();
  if (dayKey(d) === dayKey(now)) return fTime.format(d);
  if (now - d < 6 * 86400000) return fWeek.format(d);
  return fDate.format(d);
}
function dayLabel(d) {
  const now = new Date(), y = new Date(now - 86400000);
  return dayKey(d) === dayKey(now) ? 'Today' : dayKey(d) === dayKey(y) ? 'Yesterday' : fDay.format(d);
}
const oneLine = s => String(s || '').replace(/\s+/g, ' ');
function renderText(box, text) {
  const re = /https?:\/\/[^\s<>"'`]+|@[A-Za-z0-9][\w.\-\/:@]*/g, me = S.me && S.me.name;
  let i = 0, m;
  while ((m = re.exec(text))) {
    const tok = m[0];
    if (tok[0] === '@') {
      const nm = tok.slice(1).replace(/[.\-:\/]+$/, '');
      if (nm !== me || (m.index > 0 && /[\w.]/.test(text[m.index - 1]))) continue;
      box.append(text.slice(i, m.index), el('span', 'mine', '@' + nm));
      i = m.index + 1 + nm.length; re.lastIndex = i; continue;
    }
    let url = tok.replace(/[.,;:!?'"\]}>]+$/, '');
    if (url.endsWith(')') && !url.includes('(')) url = url.slice(0, -1);
    const a = el('a', null, url); a.href = url; a.rel = 'noopener noreferrer'; a.target = '_blank';
    box.append(text.slice(i, m.index), a);
    i = m.index + url.length; re.lastIndex = i;
  }
  if (i < text.length) box.append(text.slice(i));
}

/* ---------- conversation list (keyed rows, updated in place) ---------- */
const roomName = r => r.label || r.id;
function roomSig(r) {
  const l = r.last || {};
  return [roomName(r), r.unread || 0, l.ts, l.from, l.snippet, l.kind, r.topic, r.id === S.cur].join('\u0001');
}
function fillRow(b, r) {
  const c = el('span', 'c'), l = r.last;
  c.append(el('span', 'n', roomName(r)),
           el('span', 's', l ? oneLine((l.kind === 'event' ? l.from + ' ' : l.from + ': ') + (l.snippet || '')) : oneLine(r.topic)));
  const kids = [c, el('span', 'w', l ? shortWhen(l.ts) : '')];
  if (r.unread > 0 && r.id !== S.cur) kids.push(el('span', 'count', r.unread > 99 ? '99+' : String(r.unread)));
  b.className = 'conv' + (r.id === S.cur ? ' sel' : '') + (r.unread > 0 && r.id !== S.cur ? ' unread' : '');
  b.replaceChildren(...kids);
}
function renderList() {
  const q = findEl.value.trim().toLowerCase();
  const shown = S.rooms.filter(r => !q || roomName(r).toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
  const live = new Set();
  let at = listEl.firstChild;
  if (at && at.classList.contains('empty')) { at.remove(); at = listEl.firstChild; }
  for (const r of shown) {
    live.add(r.id);
    let row = S.rows.get(r.id);
    if (!row) {
      const b = el('button'); b.type = 'button'; b.onclick = () => openRoom(r.id);
      row = { b, sig: '' }; S.rows.set(r.id, row);
    }
    const sig = roomSig(r);
    if (row.sig !== sig) { fillRow(row.b, r); row.sig = sig; }
    if (row.b !== at) listEl.insertBefore(row.b, at); else at = at.nextSibling;
  }
  for (const [id, row] of S.rows) if (!live.has(id)) { row.b.remove(); if (!S.rooms.some(r => r.id === id)) S.rows.delete(id); }
  if (!shown.length) listEl.append(el('div', 'empty', S.rooms.length ? 'Nothing matches.' : 'No conversations yet.'));
}
async function pollRooms() {
  try {
    const { j, raw } = await call('/ui/api/rooms');
    if (raw === S.roomsRaw) return;
    S.roomsRaw = raw; S.rooms = j.rooms || [];
    renderList();
  } catch (e) {}
}

/* ---------- open conversation ---------- */
const canPost = () => !!(S.me && S.me.post);
const meta = () => Object.assign({}, S.rooms.find(r => r.id === S.cur) || {}, S.info || {});
function blank(text) { V = null; mainEl.replaceChildren(el('div', 'blank', text)); }
function header(title, sub) {
  const h = el('header', 'head'), back = el('button', 'back', '←'), t = el('div', 'title');
  back.type = 'button'; back.setAttribute('aria-label', 'Back'); back.onclick = closeRoom;
  t.append(el('b', null, title)); if (sub) t.append(el('span', null, sub));
  h.append(back, t);
  return h;
}
function fillHead() {
  const r = meta(), n = (r.members || []).length;
  const sub = r.topic || (r.kind === 'dm' ? '' : n + (n === 1 ? ' person' : ' people'));
  const h = header(roomName(r), sub);
  V.head.replaceWith(h); V.head = h;
}
function composer(onSend, placeholder) {
  const wrap = el('div', 'compose'), rep = el('div', 'replying'), row = el('div', 'row'), ta = el('textarea'), btn = el('button', 'btn', 'Send');
  const note = el('div', 'note');
  ta.rows = 1; ta.placeholder = placeholder; ta.setAttribute('aria-label', 'Message'); btn.type = 'button'; rep.hidden = true;
  row.append(ta, btn); wrap.append(rep, row, note);
  const c = { wrap, ta, btn, rep, note };
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  const go = async () => {
    const text = ta.value.trim(); if (!text || btn.disabled) return;
    btn.disabled = true; note.replaceChildren();
    try { await onSend(text); ta.value = ''; grow(); }
    catch (e) { note.replaceChildren(el('span', 'err', 'Not sent: ' + e.message)); }
    finally { btn.disabled = false; ta.focus(); }
  };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); go(); }
    if (ev.key === 'Escape') setReply(null);
  });
  btn.onclick = go;
  return c;
}
function setReply(m) {
  if (!V || !V.c) return;
  S.replyTo = m ? m.id : null; V.c.rep.hidden = !m;
  if (m) { V.c.rep.textContent = 'Replying to ' + m.from + ': ' + oneLine(m.text); V.c.ta.focus(); }
}
function buildView() {
  const scroll = el('div', 'scroll'), more = el('button', 'earlier', 'Show earlier messages'), msgs = el('div');
  more.type = 'button'; more.hidden = true; more.onclick = loadEarlier;
  scroll.append(more, msgs);
  msgs.addEventListener('click', onTap);
  V = { head: el('header'), scroll, more, msgs, c: null, pinned: true };
  scroll.addEventListener('scroll', () => { V.pinned = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 80; }, { passive: true });
  mainEl.replaceChildren(V.head, scroll);
  fillHead();
  if (canPost()) {
    V.c = composer(async text => {
      await call('/ui/api/messages', { room: S.cur, text, reply_to: S.replyTo || undefined });
      setReply(null); V.pinned = true; await pollRoom(); pollRooms();
    }, 'Message ' + roomName(meta()));
    mainEl.append(V.c.wrap);
  }
}

/* ---------- messages: one node per message, built once, moved or rebuilt only when its neighbours change ---------- */
// The node's display order (islandmail-core order.rs): signed time (clamped: order_ts), ties by hash, each reply
// right under its parent and that parent's earlier replies.
function displayOrder(arr) {
  const at = m => (m.order_ts || m.ts) + ' ' + m.env, cmp = (a, b) => (at(a) < at(b) ? -1 : at(a) > at(b) ? 1 : 0);
  const byShort = new Map(arr.map(m => [m.id, m])), kids = new Map(), roots = [];
  for (const m of arr) {
    const p = m.reply_to && byShort.get(m.reply_to);
    if (p && p !== m) { if (!kids.has(p.env)) kids.set(p.env, []); kids.get(p.env).push(m); } else roots.push(m);
  }
  roots.sort(cmp); for (const k of kids.values()) k.sort(cmp);
  const out = [], seen = new Set();
  const walk = r => { const st = [r]; while (st.length) { const m = st.pop(); if (seen.has(m.env)) continue; seen.add(m.env); out.push(m);
    const k = kids.get(m.env); if (k) for (let i = k.length - 1; i >= 0; i--) st.push(k[i]); } };
  roots.forEach(walk); arr.filter(m => !seen.has(m.env)).sort(cmp).forEach(walk);
  return out;
}
function msgNode(m, newDay, first) {
  const d = when(m.ts), row = el('div', 'msg' + (first ? ' first' : ''));
  if (newDay) row.append(el('div', 'day', d ? dayLabel(d) : ''));
  if (m.kind === 'event') { row.classList.add('event'); row.append(m.from + ' ' + (m.text || '')); return row; }
  if (m.reply_to) row.classList.add('reply');
  if (first) {
    const top = el('div'), t = el('span', 'at', d ? fTime.format(d) : '');
    if (d) t.title = fFull.format(d);
    top.append(el('span', 'who', m.from), t);
    if (canPost()) top.append(replyBtn(m));
    row.append(top);
  } else {
    if (d) row.title = fFull.format(d);
    if (canPost()) row.append(replyBtn(m));
  }
  if (m.quote) {
    const q = el('div', 'quote', (m.quote.from || '') + ': ' + oneLine(m.quote.text));
    q.title = 'Reply to ' + (m.quote.id || m.reply_to || ''); q.onclick = () => jumpTo(m.quote.id); row.append(q);
  }
  if (m.text) { const x = el('div', 'text'); renderText(x, m.text); row.append(x); }
  for (const f of m.files || []) row.append(fileNode(f));
  return row;
}
function replyBtn(m) {
  const r = el('button', 'rep', 'reply'); r.type = 'button';
  r.onclick = ev => { ev.stopPropagation(); setReply(m); tapped(null); };
  return r;
}
// Without hover (touch), tapping a message shows its reply button; tapping elsewhere hides it.
let tappedRow = null;
function tapped(row) { if (tappedRow) tappedRow.classList.remove('tap'); tappedRow = row; if (row) row.classList.add('tap'); }
function onTap(ev) {
  if (ev.target.closest('a, button')) return;
  const row = ev.target.closest('.msg');
  if (!row || row.classList.contains('event') || (window.getSelection && String(window.getSelection()))) return tapped(null);
  tapped(row === tappedRow ? null : row);
}
function fileNode(f) {
  const box = el('div'), a = el('a', 'file', '\u{1F4CE} ' + (f.name || 'file'));
  a.href = '#';
  a.onclick = ev => { if (a.dataset.ready) return; ev.preventDefault();
    fileUrl(f.id).then(u => { a.href = u; a.download = f.name || 'file'; a.dataset.ready = '1'; a.click(); }).catch(() => {}); };
  box.append(a);
  return box;
}
function jumpTo(id) {
  const m = S.msgs.find(x => x.id === id), n = m && S.nodes.get(m.env);
  if (n) n.node.scrollIntoView({ block: 'center' });
}
// Bring the list in line with S.msgs, touching only nodes that are new, moved or whose day/grouping changed. The
// message at the top of the view stays where it is unless the view follows the bottom.
function sync() {
  const box = V.msgs, sc = V.scroll;
  let anchor = null, anchorTop = 0;
  if (!V.pinned) {
    const top = sc.getBoundingClientRect().top;
    for (const n of box.children) { const b = n.getBoundingClientRect(); if (b.bottom > top) { anchor = n; anchorTop = b.top; break; } }
  }
  let prev = null, at = box.firstChild;
  const live = new Set();
  for (const m of S.msgs) {
    const d = when(m.ts), pd = prev && when(prev.ts);
    const newDay = !prev || dayKey(d) !== dayKey(pd);
    const first = m.kind !== 'event' && (newDay || !prev || prev.kind === 'event' || prev.from !== m.from || !!m.reply_to
      || !!prev.reply_to || (d && pd && d - pd > 5 * 60000));
    const sig = (newDay ? 'd' : '') + (first ? 'f' : '');
    let n = S.nodes.get(m.env);
    if (!n || n.sig !== sig) {
      const node = msgNode(m, newDay, first);
      if (n) { if (n.node === at) at = node; n.node.replaceWith(node); }
      n = { node, sig }; S.nodes.set(m.env, n);
    }
    live.add(m.env);
    if (n.node !== at) box.insertBefore(n.node, at); else at = at.nextSibling;
    prev = m;
  }
  for (const [env, n] of S.nodes) if (!live.has(env)) { n.node.remove(); S.nodes.delete(env); }
  V.more.hidden = !S.more;
  if (V.pinned) toBottom();
  else if (anchor && anchor.isConnected) sc.scrollTop += anchor.getBoundingClientRect().top - anchorTop;
}
const toBottom = () => { if (V) V.scroll.scrollTop = V.scroll.scrollHeight; };
function ingest(arr) {
  let n = 0;
  for (const m of arr || []) {
    S.maxSeq = Math.max(S.maxSeq, m.seq || 0);
    if (!S.byEnv.has(m.env)) { S.byEnv.set(m.env, m); n++; }
  }
  if (n) S.msgs = displayOrder([...S.byEnv.values()]);
  return n;
}
function setInfo(room) {
  const raw = JSON.stringify(room || null);
  if (raw === S.infoRaw) return;
  S.info = room || null; S.infoRaw = raw;
  if (V) fillHead();
}
async function markRead() {
  if (!S.cur || !S.maxSeq || document.hidden || S.readAt === S.cur + ':' + S.maxSeq) return;
  S.readAt = S.cur + ':' + S.maxSeq;
  try {
    await call('/ui/api/read', { room: S.cur, seq: S.maxSeq });
    const r = S.rooms.find(x => x.id === S.cur); if (r) r.unread = 0;
    renderList();
  } catch (e) {}
}
async function openRoom(id) {
  if (!id) return;
  const token = ++S.token;
  Object.assign(S, { cur: id, info: null, infoRaw: '', msgs: [], byEnv: new Map(), nodes: new Map(), maxSeq: 0, more: false,
                     loaded: false, replyTo: null });
  history.replaceState(null, '', location.pathname + location.search + '#room=' + encodeURIComponent(id));
  appEl.classList.add('open'); renderList(); buildView();
  V.msgs.append(el('div', 'blank', 'Loading…'));
  try {
    const { j } = await call('/ui/api/messages?' + qs({ room: id, limit: PAGE }));
    if (token !== S.token) return;
    V.msgs.replaceChildren(); setInfo(j.room); ingest(j.messages); S.more = !!j.more; S.loaded = true;
    V.pinned = true; sync(); markRead();
    if (V.c && window.matchMedia('(min-width: 701px)').matches) V.c.ta.focus();
  } catch (e) {
    if (token === S.token && V) V.msgs.replaceChildren(el('div', 'blank', 'Could not open this conversation: ' + e.message));
  }
}
function closeRoom() {
  S.token++; S.cur = null; S.loaded = false; appEl.classList.remove('open');
  history.replaceState(null, '', location.pathname + location.search);
  blank(S.rooms.length ? 'Pick a conversation.' : ''); renderList();
}
async function loadEarlier() {
  if (!S.loaded || !S.msgs.length) return;
  const token = S.token;
  V.more.disabled = true;
  try {
    const { j } = await call('/ui/api/messages?' + qs({ room: S.cur, limit: PAGE, before: S.msgs[0].seq }));
    if (token !== S.token) return;
    S.more = !!j.more; ingest(j.messages); V.pinned = false; sync();
  } catch (e) {} finally { if (V) V.more.disabled = false; }
}
let roomBusy = false;
async function pollRoom() {
  if (roomBusy || !S.loaded || !S.cur) return;
  roomBusy = true; const token = S.token;
  try {
    for (let round = 0; round < 5; round++) {
      const { j } = await call('/ui/api/messages?' + qs({ room: S.cur, limit: 100, since: S.maxSeq }));
      if (token !== S.token) return;
      setInfo(j.room);
      if (ingest(j.messages)) { sync(); markRead(); }
      if (!j.more) break;
    }
  } catch (e) {} finally { roomBusy = false; }
}

/* ---------- new conversation ---------- */
function dmId(a, b) { a = a.trim().toLowerCase(); b = b.trim().toLowerCase(); return 'dm:' + (a <= b ? a + '+' + b : b + '+' + a); }
function newConversation() {
  S.token++; S.cur = null; S.loaded = false; appEl.classList.add('open'); renderList();
  const form = el('div', 'newform'), to = el('input', 'to'), name = el('input', 'rname');
  to.placeholder = 'To: a name, or several for a group'; to.setAttribute('list', 'people'); to.autocomplete = 'off'; to.spellcheck = false;
  name.placeholder = 'Group name (letters, digits, - . _)'; name.hidden = true; name.autocomplete = 'off'; name.spellcheck = false;
  form.append(to, name);
  const names = () => to.value.split(/[\s,]+/).map(x => x.replace(/^@/, '')).filter(Boolean);
  to.addEventListener('input', () => { name.hidden = names().length < 2; });
  const c = composer(async text => {
    const who = names();
    if (!who.length) throw new Error('say who it is for');
    let room;
    if (who.length === 1) room = dmId(S.me.name, who[0]);
    else {
      const r = (await call('/ui/api/rooms/new', { name: name.value.trim(), members: who })).j;
      room = r.room;
      if (r.unknown && r.unknown.length) alert('Not on this network yet: ' + r.unknown.join(', '));
    }
    await call('/ui/api/messages', { room, text });
    S.roomsRaw = ''; await pollRooms(); openRoom(room);
  }, 'Message');
  V = null;
  mainEl.replaceChildren(header('New conversation', ''), form, el('div', 'blank'), c.wrap);
  to.focus();
}

/* ---------- boot ---------- */
findEl.addEventListener('input', renderList);
findEl.addEventListener('keydown', ev => { if (ev.key === 'Escape') { findEl.value = ''; renderList(); } });
$('new').onclick = newConversation;
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollRooms(); pollRoom(); } });
async function boot() {
  if (!KEY) { gate('Islandmail', 'Open this page with the link from:'); return; }
  blank('');
  try { S.me = (await call('/ui/api/me')).j; } catch (e) { return; }
  $('me').textContent = S.me.name + (canPost() ? '' : ' · read-only');
  $('new').hidden = !canPost();
  const dl = $('people'); for (const a of S.me.agents || []) { if (a !== S.me.name) { const o = el('option'); o.value = a; dl.append(o); } }
  await pollRooms();
  const want = hashParams().get('room');
  if (want) openRoom(want); else blank(S.rooms.length ? 'Pick a conversation.' : '');
  setInterval(() => { if (!document.hidden) pollRooms(); }, 5000);
  setInterval(() => { if (!document.hidden) pollRoom(); }, 3000);
}
boot();
</script>
