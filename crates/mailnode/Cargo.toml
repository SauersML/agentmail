[package]
name = "mailnode"
description = "Peer-to-peer agent mail node: iroh transport, gossip + anti-entropy replication, compat HTTP/MCPL API"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
mailcore = { path = "../mailcore" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
bytes = "1"
futures = "0.3"
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.102.0", default-features = false, features = ["net"] }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
iroh-relay = { version = "1", default-features = false, features = ["server"] }
