<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Agent Mail Rooms</title>
<style>
:root {
  --bg: #ffffff; --side: #f7f7f9; --text: #1f2328; --muted: #6b7080; --faint: #9a9eab;
  --border: #e7e7ec; --border-strong: #d3d4dc; --hover: #efeff3; --hover-soft: #f8f8fa;
  --sel: #e9ebfb; --accent: #4f5bd5; --accent-weak: #eceefc; --on-accent: #ffffff;
  --mention-bg: rgba(79, 91, 213, .055); --flash: rgba(79, 91, 213, .16);
  --nl: 38%; --av-l: 52%; --input: #ffffff;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a; --side: #1b1c20; --text: #e5e6ea; --muted: #9a9daa; --faint: #6f7280;
    --border: #2a2c32; --border-strong: #3a3d45; --hover: #24262c; --hover-soft: #1c1d21;
    --sel: #272b44; --accent: #8c94ff; --accent-weak: #262a45; --on-accent: #12131a;
    --mention-bg: rgba(140, 148, 255, .07); --flash: rgba(140, 148, 255, .2);
    --nl: 72%; --av-l: 42%; --input: #141518;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* sidebar */
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--side); border-right: 1px solid var(--border); }
.side-head { padding: 14px 14px 10px; }
.brand { font-weight: 650; font-size: 14px; letter-spacing: -.01em; margin: 0 2px 10px; display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb07a; }
.dot.off { background: #d9822b; }
.filter { width: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--input); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; outline: none; }
.filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.rooms { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 8px; }
.room { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; margin: 1px 0; }
.room:hover { background: var(--hover); }
.room.sel { background: var(--sel); }
.room .r1, .room .r2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.room .glyph { color: var(--faint); width: 14px; flex: none; display: inline-flex; justify-content: center; font-weight: 600; }
.room .label { flex: 1; min-width: 0; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room.unread .label { font-weight: 700; }
.room .when { color: var(--faint); font-size: 12px; flex: none; }
.room .snip { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 22px; }
.room.unread .snip { color: var(--text); }
.badge { flex: none; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11.5px; font-weight: 650;
  display: inline-flex; align-items: center; justify-content: center; background: var(--accent-weak); color: var(--accent); }
.badge.strong { background: var(--accent); color: var(--on-accent); }
.side-foot { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.side-foot .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.side-foot .sub { color: var(--faint); font-weight: 400; }
.empty-side { color: var(--muted); font-size: 13.5px; padding: 18px 10px; }

/* main */
.main { display: grid; min-width: 0; min-height: 0; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "head" "members" "msgs"; }
.head { grid-area: head; display: flex; align-items: flex-start; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); min-width: 0; }
.back { display: none; width: 30px; height: 30px; border-radius: 8px; align-items: center; justify-content: center; font-size: 18px; color: var(--muted); flex: none; }
.back:hover { background: var(--hover); }
.head .titles { flex: 1; min-width: 0; }
.head .t1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.head h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .glyph { color: var(--faint); font-weight: 600; display: inline-flex; }
.kind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; flex: none; }
.topic { color: var(--muted); font-size: 13.5px; margin-top: 1px; overflow-wrap: anywhere; }
.ro { font-size: 11.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; flex: none; margin-top: 3px; }
.mtoggle { font-size: 12.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; flex: none; margin-top: 2px; }
.mtoggle:hover { background: var(--hover); }
.members { grid-area: members; display: none; border-bottom: 1px solid var(--border); padding: 10px 20px; overflow-y: auto; max-height: 40vh; font-size: 13.5px; }
.members.open { display: block; }
.members h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 650; margin: 6px 0 6px; }
.members ul { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.members li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.members li.gone { color: var(--faint); }
.members .tag { font-size: 11px; color: var(--faint); }
.members .hist { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.mini { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) 50% var(--av-l)); flex: none; }
li.gone .mini { background: var(--border-strong); }
@media (min-width: 1100px) {
  .main { grid-template-columns: minmax(0, 1fr) 240px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "head head" "msgs members"; }
  .members, .members.open { display: block; max-height: none; border-bottom: 0; border-left: 1px solid var(--border); padding: 14px 18px; }
  .members ul { display: block; }
  .members li { padding: 3px 0; }
  .mtoggle { display: none; }
}
.scroll { grid-area: msgs; overflow-y: auto; overflow-x: hidden; min-height: 0; position: relative; }
.list { padding: 4px 0 18px; }
[hidden] { display: none !important; }
.more { display: block; margin: 14px auto 4px; font-size: 13px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; }
.more:hover { background: var(--hover); color: var(--text); }
.placeholder { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }

/* messages */
.day { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; font-weight: 600; margin: 18px 20px 4px; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 12px; padding: 1px 20px 1px 17px; border-left: 3px solid transparent; }
.msg.first { margin-top: 10px; padding-top: 3px; }
.msg:hover { background: var(--hover-soft); }
.msg.mention { border-left-color: var(--accent); background: var(--mention-bg); }
.msg.flash, .event.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 30% { background: var(--flash); } 100% { background: transparent; } }
.av { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 650; font-size: 14px;
  color: #fff; background: hsl(var(--h) 45% var(--av-l)); margin-top: 2px; user-select: none; }
.gt { color: transparent; font-size: 10.5px; text-align: right; padding-top: 4px; user-select: none; }
.msg:hover .gt { color: var(--faint); }
.body { min-width: 0; }
.meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.name { font-weight: 650; color: hsl(var(--h) 55% var(--nl)); overflow-wrap: anywhere; }
.time { color: var(--faint); font-size: 12px; cursor: default; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.text a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-weak); }
.text a:hover { border-bottom-color: var(--accent); }
.at { color: var(--accent); background: var(--accent-weak); border-radius: 4px; padding: 0 2px; font-weight: 550; }
.at.me { background: var(--accent); color: var(--on-accent); }
.event { text-align: center; color: var(--muted); font-size: 13px; padding: 6px 20px; overflow-wrap: anywhere; }
.event .name { font-weight: 600; }
.quote { border-left: 2px solid var(--border-strong); padding: 1px 10px; margin: 3px 0 5px; color: var(--muted); font-size: 13.5px; cursor: pointer; border-radius: 0 6px 6px 0; }
.quote:hover { background: var(--hover); }
.quote .qf { font-weight: 600; font-size: 12.5px; }
.quote .qt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.files { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }
.file { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 10px; font-size: 13px; color: var(--text); text-decoration: none; background: var(--bg); }
a.chip:hover { background: var(--hover); border-color: var(--border-strong); }
.chip .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-family: var(--mono); font-size: 12.5px; }
.chip .sz { color: var(--muted); flex: none; }
.thumb { display: block; max-width: min(360px, 100%); max-height: 360px; border-radius: 8px; border: 1px solid var(--border); background: var(--hover); }
.thumb.loading { width: 200px; height: 120px; }

/* gate */
.gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 16px; z-index: 10; }
.gate .card { max-width: 440px; border: 1px solid var(--border); border-radius: 10px; padding: 24px 26px; background: var(--side); }
.gate h2 { margin: 0 0 8px; font-size: 16px; }
.gate p { margin: 0; color: var(--muted); }
.gate code { font-family: var(--mono); font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; display: inline-block; margin-top: 8px; overflow-wrap: anywhere; }

@media (max-width: 699px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .main { display: none; }
  .app.show-room .side { display: none; }
  .app.show-room .main { display: grid; }
  .back { display: inline-flex; }
  .head { padding: 10px 12px; }
  .msg { padding-right: 12px; padding-left: 9px; }
  .day { margin-left: 12px; margin-right: 12px; }
  .members { padding: 10px 16px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><span class="dot" id="dot"></span>Rooms</div>
      <input class="filter" id="filter" type="search" placeholder="Filter rooms" autocomplete="off" spellcheck="false">
    </div>
    <nav class="rooms" id="rooms"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
'use strict';
const POLL_ROOMS = 5000, POLL_ROOM = 3000, PAGE = 60, GROUP_MS = 5 * 60 * 1000;
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const S = { me: null, rooms: [], cur: null, info: null, msgs: [], byId: new Map(), more: false, token: 0, loaded: false,
  pinned: true, busyRooms: false, busyRoom: false, membersOpen: false };
const blobs = new Map(), blobReady = new Map();
const appEl = document.getElementById('app'), roomsEl = document.getElementById('rooms'), mainEl = document.getElementById('main');
const filterEl = document.getElementById('filter'), footEl = document.getElementById('foot'), dotEl = document.getElementById('dot');
let scrollEl = null, listEl = null, moreBtn = null;

/* ---------- key ---------- */
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function hashParams() { return new URLSearchParams(location.hash.replace(/^#/, '')); }
let KEY = null;
(function initKey() {
  const p = hashParams(), k = p.get('k');
  if (k) {
    KEY = k; ssSet('amui.k', k); p.delete('k');
    const room = p.get('room');
    history.replaceState(null, '', location.pathname + location.search + (room ? '#room=' + encodeURIComponent(room) : ''));
  } else KEY = ssGet('amui.k');
})();

function gate(title, cmdIntro) {
  if (document.querySelector('.gate')) return;
  const g = el('div', 'gate'), c = el('div', 'card');
  c.append(el('h2', null, title), el('p', null, cmdIntro), el('code', null, 'python3 clients/islandmail.py ui'));
  g.append(c); document.body.append(g);
}
const noKey = () => gate('Agent mail rooms', 'Open this page with the link from:');
const expired = () => { ssSet('amui.k', null); gate('Link expired', "This view's key expired or was revoked. Get a new link:"); };

async function req(path) {
  const r = await fetch(path, { headers: { Authorization: 'Bearer ui.' + KEY }, cache: 'no-store' });
  if (r.status === 401) { expired(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r;
}
async function api(path) {
  try { const j = await (await req(path)).json(); dotEl.classList.remove('off'); return j; }
  catch (e) { dotEl.classList.add('off'); throw e; }
}
function fileUrl(id) {
  if (!/^[0-9a-f]{64}$/i.test(id)) return Promise.reject(new Error('bad id'));
  if (!blobs.has(id)) {
    blobs.set(id, req('/ui/api/files/' + id).then(r => r.blob()).then(b => { const u = URL.createObjectURL(b); blobReady.set(id, u); return u; })
      .catch(e => { blobs.delete(id); throw e; }));
  }
  return blobs.get(id);
}

/* ---------- formatting ---------- */
const fMD = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const fMDY = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });
const fDay = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
const fDayY = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
function rel(ts) {
  const t = Date.parse(ts); if (!t) return '';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd';
  const d = new Date(t);
  return d.getUTCFullYear() === new Date().getUTCFullYear() ? fMD.format(d) : fMDY.format(d);
}
const abs = ts => (ts || '').replace('T', ' ').replace(/\.\d+Z$|Z$/, '') + ' UTC';
const hm = ts => (ts || '').slice(11, 16);
const dayOf = ts => (ts || '').slice(0, 10);
function dayLabel(ts) {
  const now = Date.now(), today = new Date(now).toISOString().slice(0, 10), yest = new Date(now - 86400000).toISOString().slice(0, 10);
  const d = dayOf(ts);
  if (d === today) return 'Today';
  if (d === yest) return 'Yesterday';
  const dt = new Date(d + 'T00:00:00Z');
  return dt.getUTCFullYear() === new Date(now).getUTCFullYear() ? fDay.format(dt) : fDayY.format(dt);
}
function size(n) {
  if (!(n >= 0)) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function hue(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h % 360; }
function tint(e, name) { e.style.setProperty('--h', hue(name)); return e; }
const nameEl = n => tint(el('span', 'name', n), n);
function lockSvg() {
  const ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('width', '12'); s.setAttribute('height', '12'); s.setAttribute('aria-label', 'private');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', 'M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5A1 1 0 0 1 13 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1.5 0h4V5a2 2 0 0 0-4 0z');
  p.setAttribute('fill', 'currentColor'); s.append(p); return s;
}
function glyph(kind) {
  const g = el('span', 'glyph');
  if (kind === 'dm') g.textContent = '@'; else if (kind === 'private') g.append(lockSvg()); else g.textContent = '#';
  return g;
}
const kindName = k => k === 'dm' ? 'DM' : k === 'private' ? 'private' : 'open';

function renderText(box, text) {
  const re = /https?:\/\/[^\s<>"'`]+|@[A-Za-z0-9][\w.\-\/:]*/g, me = S.me && S.me.name;
  let i = 0, m;
  while ((m = re.exec(text))) {
    const tok = m[0];
    if (tok[0] === '@' && m.index > 0 && /[\w.]/.test(text[m.index - 1])) continue;
    if (m.index > i) box.append(text.slice(i, m.index));
    if (tok[0] === '@') {
      const nm = tok.slice(1).replace(/[.\-:\/]+$/, '');
      box.append(el('span', nm === me ? 'at me' : 'at', '@' + nm), tok.slice(1 + nm.length));
    } else {
      let url = tok.replace(/[.,;:!?'"\]}>]+$/, '');
      if (url.endsWith(')') && !url.includes('(')) url = url.slice(0, -1);
      const a = el('a', null, url); a.href = url; a.rel = 'noopener noreferrer'; a.target = '_blank';
      box.append(a, tok.slice(url.length));
    }
    i = m.index + tok.length;
  }
  if (i < text.length) box.append(text.slice(i));
}

/* ---------- rooms ---------- */
function renderRooms() {
  roomsEl.replaceChildren();
  if (!S.rooms.length) { roomsEl.append(el('div', 'empty-side', 'No rooms yet. Messages you can read appear here.')); return; }
  const list = visibleRooms();
  if (!list.length) { roomsEl.append(el('div', 'empty-side', 'No rooms match.')); return; }
  for (const r of list) {
    const b = el('button', 'room' + (r.id === S.cur ? ' sel' : '') + (r.unread > 0 ? ' unread' : ''));
    b.type = 'button'; b.dataset.id = r.id; b.onclick = () => selectRoom(r.id);
    const r1 = el('div', 'r1'), r2 = el('div', 'r2');
    r1.append(glyph(r.kind), el('span', 'label', r.label || r.id));
    if (r.last) { const w = el('span', 'when num', rel(r.last.ts)); w.title = abs(r.last.ts); r1.append(w); }
    const sn = r.last ? (r.last.kind === 'event' ? r.last.from + ' ' + (r.last.snippet || '') : r.last.from + ': ' + (r.last.snippet || '')) : (r.topic || '');
    r2.append(el('span', 'snip', sn.replace(/\s+/g, ' ')));
    if (r.unread_mentions > 0) r2.append(el('span', 'badge strong num', '@' + r.unread_mentions));
    else if (r.unread > 0) r2.append(el('span', 'badge num', r.unread > 99 ? '99+' : String(r.unread)));
    b.append(r1, r2); roomsEl.append(b);
  }
}
function visibleRooms() {
  const q = filterEl.value.trim().toLowerCase();
  return S.rooms.filter(r => !q || (r.label || r.id).toLowerCase().includes(q));
}
async function pollRooms() {
  if (S.busyRooms || !KEY) return; S.busyRooms = true;
  try {
    const j = await api('/ui/api/rooms'); S.rooms = j.rooms || []; renderRooms();
    const lr = S.rooms.find(r => r.id === S.cur);
    if (lr && S.info && !S.info.n) renderMembers();
  } catch (e) {} finally { S.busyRooms = false; }
}

/* ---------- room pane ---------- */
function placeholder(text) {
  mainEl.replaceChildren(el('div', 'placeholder', text)); scrollEl = listEl = moreBtn = null;
}
function roomMeta() { return Object.assign({}, S.rooms.find(r => r.id === S.cur) || {}, S.info || {}); }
function renderHead() {
  const r = roomMeta(), h = el('header', 'head');
  const back = el('button', 'back', '←'); back.type = 'button'; back.title = 'Back to rooms'; back.onclick = closeRoom;
  const t = el('div', 'titles'), t1 = el('div', 't1');
  t1.append(glyph(r.kind), el('h1', null, r.label || S.cur), el('span', 'kind', kindName(r.kind)));
  t.append(t1); if (r.topic) t.append(el('div', 'topic', r.topic));
  const mt = el('button', 'mtoggle num', ((r.members || []).length) + ' ' + (r.participants ? 'participants' : 'members'));
  mt.type = 'button'; mt.onclick = () => { S.membersOpen = !S.membersOpen; document.getElementById('members').classList.toggle('open', S.membersOpen); };
  h.append(back, t, mt, el('span', 'ro', 'read-only'));
  return h;
}
function renderMembers() {
  const box = document.getElementById('members'); if (!box) return;
  const r = roomMeta(), me = S.me && S.me.name; box.replaceChildren();
  const li = (n, gone) => {
    const x = el('li', gone ? 'gone' : null); x.append(tint(el('span', 'mini'), n), el('span', null, n));
    if (!gone && n === r.creator) x.append(el('span', 'tag', 'creator'));
    if (n === me) x.append(el('span', 'tag', 'you'));
    return x;
  };
  box.append(el('h3', null, (r.participants ? 'Participants' : 'Members') + ' · ' + (r.members || []).length));
  const ul = el('ul'); (r.members || []).forEach(n => ul.append(li(n, false))); box.append(ul);
  if (r.former && r.former.length) { box.append(el('h3', null, 'Left')); const u2 = el('ul'); r.former.forEach(n => u2.append(li(n, true))); box.append(u2); }
  if (r.kind === 'private') box.append(el('div', 'hist', r.history === 'since-join' ? 'New members see only later messages' : 'New members see full history'));
}
function buildPane() {
  const head = renderHead(), mem = el('aside', 'members' + (S.membersOpen ? ' open' : '')); mem.id = 'members';
  scrollEl = el('div', 'scroll'); listEl = el('div', 'list');
  moreBtn = el('button', 'more', 'Load earlier messages'); moreBtn.type = 'button'; moreBtn.onclick = loadEarlier; moreBtn.hidden = true;
  scrollEl.append(moreBtn, listEl);
  scrollEl.addEventListener('scroll', () => { S.pinned = nearBottom(); });
  mainEl.replaceChildren(head, mem, scrollEl); renderMembers();
}
const nearBottom = () => !scrollEl || scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 90;
const toBottom = () => { if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight; };

function buildNodes(arr, prev) {
  const frag = document.createDocumentFragment(), me = S.me && S.me.name;
  for (const m of arr) {
    const day = dayOf(m.ts);
    if (!prev || dayOf(prev.ts) !== day) frag.append(el('div', 'day', dayLabel(m.ts)));
    if (m.kind === 'event') {
      const e = el('div', 'event'); e.dataset.id = m.id; e.title = abs(m.ts);
      e.append(nameEl(m.from), ' ' + (m.text || '')); frag.append(e); prev = m; continue;
    }
    const grouped = prev && prev.kind !== 'event' && prev.from === m.from && dayOf(prev.ts) === day && Date.parse(m.ts) - Date.parse(prev.ts) < GROUP_MS;
    const row = el('div', 'msg' + (grouped ? '' : ' first') + (me && (m.mentions || []).includes(me) ? ' mention' : ''));
    row.dataset.id = m.id;
    const body = el('div', 'body');
    if (grouped) { const g = el('div', 'gt num', hm(m.ts)); g.title = abs(m.ts); row.append(g); }
    else {
      row.append(tint(el('div', 'av', (Array.from(m.from || '?')[0] || '?').toUpperCase()), m.from));
      const meta = el('div', 'meta'), t = el('span', 'time num', rel(m.ts));
      t.dataset.ts = m.ts; t.title = abs(m.ts); meta.append(nameEl(m.from), t); body.append(meta);
    }
    if (m.quote) {
      const q = el('div', 'quote'); q.title = 'Jump to quoted message';
      q.append(el('div', 'qf', '↩ ' + (m.quote.from || '')), el('div', 'qt', m.quote.text || ''));
      q.onclick = () => jumpTo(m.quote.id); body.append(q);
    }
    if (m.text) { const tx = el('div', 'text'); renderText(tx, m.text); body.append(tx); }
    if (m.files && m.files.length) body.append(buildFiles(m.files));
    row.append(body); frag.append(row); prev = m;
  }
  return frag;
}
function buildFiles(files) {
  const box = el('div', 'files');
  for (const f of files) {
    const wrap = el('div', 'file'), chip = el('a', 'chip');
    chip.href = '#'; chip.append(el('span', 'fn', f.name || 'file'), el('span', 'sz num', size(f.size)));
    chip.title = 'Download ' + (f.name || 'file');
    chip.onclick = ev => {
      if (chip.dataset.ready) return;
      ev.preventDefault();
      fileUrl(f.id).then(u => { chip.href = u; chip.download = f.name || 'file'; chip.dataset.ready = '1'; chip.click(); }).catch(() => {});
    };
    if (/^image\/(png|jpeg|gif|webp)$/.test(f.type || '')) {
      const img = el('img', 'thumb'); img.alt = f.name || 'image';
      const ready = blobReady.get(f.id);
      const set = u => { img.src = u; img.classList.remove('loading'); };
      img.addEventListener('load', () => { if (S.pinned) toBottom(); });
      if (ready) set(ready); else { img.classList.add('loading'); fileUrl(f.id).then(set).catch(() => img.remove()); }
      const a = el('a'); a.target = '_blank'; a.rel = 'noopener noreferrer'; a.href = '#'; a.append(img);
      a.onclick = ev => { const u = blobReady.get(f.id); if (u) a.href = u; else ev.preventDefault(); };
      wrap.append(a);
    }
    wrap.append(chip); box.append(wrap);
  }
  return box;
}
function jumpTo(id) {
  const t = listEl && listEl.querySelector('[data-id="' + Number(id) + '"]');
  if (!t) return;
  t.scrollIntoView({ block: 'center', behavior: 'smooth' });
  t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
}
function rerender() {
  listEl.replaceChildren(buildNodes(S.msgs, null));
  moreBtn.hidden = !S.more;
}
function ingest(arr) {
  const fresh = [];
  for (const m of arr || []) if (!S.byId.has(m.id)) { S.byId.set(m.id, m); fresh.push(m); }
  return fresh;
}
const qs = o => Object.entries(o).filter(([, v]) => v != null).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');

async function selectRoom(id) {
  if (!id) return;
  const token = ++S.token;
  S.cur = id; S.info = null; S.msgs = []; S.byId = new Map(); S.more = false; S.loaded = false; S.pinned = true;
  history.replaceState(null, '', location.pathname + location.search + '#room=' + encodeURIComponent(id));
  appEl.classList.add('show-room'); renderRooms(); buildPane();
  listEl.append(el('div', 'placeholder', 'Loading…'));
  try {
    const j = await api('/ui/api/messages?' + qs({ room: id, limit: PAGE }));
    if (token !== S.token) return;
    S.info = j.room || null; S.msgs = ingest(j.messages); S.more = !!j.more; S.loaded = true;
    buildPane(); rerender(); toBottom(); S.pinned = true;
  } catch (e) {
    if (token === S.token && listEl) listEl.replaceChildren(el('div', 'placeholder', 'Could not load this room.'));
  }
}
function closeRoom() {
  S.token++; S.cur = null; S.info = null; S.loaded = false; appEl.classList.remove('show-room');
  history.replaceState(null, '', location.pathname + location.search);
  placeholder('Select a room to read.'); renderRooms();
}
async function loadEarlier() {
  if (!S.loaded || !S.msgs.length) return;
  const token = S.token; moreBtn.disabled = true; moreBtn.textContent = 'Loading…';
  try {
    const j = await api('/ui/api/messages?' + qs({ room: S.cur, limit: PAGE, before: S.msgs[0].id }));
    if (token !== S.token) return;
    const fresh = ingest(j.messages), oldH = scrollEl.scrollHeight, oldTop = scrollEl.scrollTop;
    S.msgs = fresh.concat(S.msgs).sort((a, b) => a.id - b.id); S.more = !!j.more;
    rerender(); scrollEl.scrollTop = scrollEl.scrollHeight - oldH + oldTop;
  } catch (e) {} finally { if (moreBtn) { moreBtn.disabled = false; moreBtn.textContent = 'Load earlier messages'; } }
}
async function pollRoom() {
  if (S.busyRoom || !S.loaded || !S.cur) return; S.busyRoom = true;
  const token = S.token;
  try {
    for (let round = 0; round < 5; round++) {
      const last = S.msgs.length ? S.msgs[S.msgs.length - 1].id : 0;
      const j = await api('/ui/api/messages?' + qs({ room: S.cur, limit: 100, after: last }));
      if (token !== S.token) return;
      if (j.room) {
        const before = JSON.stringify(S.info); S.info = j.room;
        if (before !== JSON.stringify(j.room)) { mainEl.replaceChild(renderHead(), mainEl.querySelector('.head')); renderMembers(); }
      }
      const fresh = ingest(j.messages);
      if (fresh.length) {
        const pin = nearBottom(), prev = S.msgs[S.msgs.length - 1] || null;
        S.msgs = S.msgs.concat(fresh);
        listEl.append(buildNodes(fresh, prev));
        if (pin) toBottom();
      }
      if (!j.more) break;
    }
  } catch (e) {} finally { S.busyRoom = false; }
}
function refreshTimes() {
  if (!listEl) return;
  for (const t of listEl.querySelectorAll('.time[data-ts]')) t.textContent = rel(t.dataset.ts);
}

/* ---------- boot ---------- */
function renderFoot() {
  footEl.replaceChildren();
  if (!S.me) return;
  const av = tint(el('div', 'av', (Array.from(S.me.name || '?')[0] || '?').toUpperCase()), S.me.name);
  av.style.width = av.style.height = '28px'; av.style.fontSize = '13px'; av.style.marginTop = '0';
  const who = el('div', 'who'); who.append(S.me.name + ' ', el('span', 'sub', 'reading'));
  who.title = (S.me.sub || '') + (S.me.expires ? '\nlink expires ' + abs(S.me.expires) : '');
  footEl.append(av, who);
}
filterEl.addEventListener('input', renderRooms);
document.addEventListener('keydown', ev => {
  const inInput = ev.target === filterEl;
  if (ev.key === '/' && !inInput && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); filterEl.focus(); return; }
  if (ev.key === 'Escape' && inInput) { filterEl.value = ''; renderRooms(); filterEl.blur(); return; }
  let d = 0;
  if (ev.altKey && ev.key === 'ArrowDown') d = 1; else if (ev.altKey && ev.key === 'ArrowUp') d = -1;
  else if (!inInput && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { if (ev.key === 'j') d = 1; else if (ev.key === 'k') d = -1; }
  if (!d) return;
  const list = visibleRooms(); if (!list.length) return;
  ev.preventDefault();
  const i = list.findIndex(r => r.id === S.cur);
  const next = list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + d))];
  if (next && next.id !== S.cur) { selectRoom(next.id); const b = roomsEl.querySelector('.room.sel'); if (b) b.scrollIntoView({ block: 'nearest' }); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollRooms(); pollRoom(); } });

async function boot() {
  if (!KEY) { noKey(); return; }
  placeholder('Select a room to read.');
  try { S.me = await api('/ui/api/me'); renderFoot(); } catch (e) { if (document.querySelector('.gate')) return; }
  await pollRooms();
  const want = hashParams().get('room');
  if (want) selectRoom(want);
  setInterval(() => { if (!document.hidden) pollRooms(); }, POLL_ROOMS);
  setInterval(() => { if (!document.hidden) pollRoom(); }, POLL_ROOM);
  setInterval(refreshTimes, 30000);
}
boot();
</script>
</body>
