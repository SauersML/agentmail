[package]
name = "mailcore"
description = "Envelope, crypto, agent and aid1 tokens, membership and thread order for agent mail"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
curve25519-dalek = "4"
ed25519-dalek = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
