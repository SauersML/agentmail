[package]
name = "islandmail-fuzz-harness"
description = "The islandmail-node modules as a library, and fixed test worlds, for the fuzz targets and property tests"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# The node modules' own unit tests run in the node crate.
[lib]
test = false

# The node's own dependencies (crates/islandmail-node/Cargo.toml), since its modules are compiled here.
[dependencies]
islandmail-core = { path = "../../crates/islandmail-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures = "0.3"
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "=0.102.0", default-features = false, features = ["net"] }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(fuzzing)'] }
