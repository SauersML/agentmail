[package]
name = "islandmail-fuzz"
description = "cargo-fuzz targets for every parser of untrusted bytes in islandmail (see fuzz/README.md)"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
islandmail-core = { path = "../crates/islandmail-core" }
islandmail-fuzz-harness = { path = "harness" }
axum = "0.8"
blake3 = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

# Separate from the main workspace: the fuzz crates build only here, with their own lock file.
[workspace]
members = [".", "harness"]

[profile.release]
debug = 1

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_body"
path = "fuzz_targets/sealed_body.rs"
test = false
