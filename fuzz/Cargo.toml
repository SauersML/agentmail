[package]
name = "islandmail-fuzz"
description = "cargo-fuzz targets for the parsers of untrusted bytes in islandmail (see fuzz/README.md)"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
islandmail-core = { path = "../crates/islandmail-core" }
islandmail-node = { path = "../crates/islandmail-node" }
blake3 = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Separate from the main workspace: the fuzz crates build only here (CI copies the root Cargo.lock in first).
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sync_request"
path = "fuzz_targets/sync_request.rs"
test = false
doc = false
bench = false
